name: iOS uygulamasını derle

on:
  workflow_dispatch:          # elle çalıştırılıyor — masaüstü derlemesiyle karışmasın

jobs:
  derle:
    # GitHub'ın macOS 26 sunucusu — Xcode 26 kurulu geliyor.
    # Kullanıcının kendi Mac'i (macOS 14.4, Xcode 16.2) iOS 26 telefona uygulama
    # atamıyor ve yükseltmeye diskte yer yok; o yüzden derleme burada.
    runs-on: macos-26

    steps:
      # Kaynak PRIVATE repodan: pexatasoy/fotoyol, `derleme-ios` dalı (yayınla betiğinin hazırladığı
      # paket; eskiden herkese açık zip'ti). Okuma: repoya özel salt-okunur deploy key (ANAHTAR_FOTOYOL).
      - name: Kaynağı çek
        uses: actions/checkout@v4
        with:
          repository: pexatasoy/fotoyol
          ref: derleme-ios
          ssh-key: ${{ secrets.ANAHTAR_FOTOYOL }}
          persist-credentials: false

      - name: Bu derlemedeki kaynak
        run: |
          git log -1 --format='paket: %h  %cd'
          echo "--- bu derlemedeki kaynak ---"
          cat DAMGA.txt
          ls -R Kaynaklar project.yml

      - name: Ortamı göster
        run: |
          sw_vers
          xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: Derle (imzasız — imzalamayı Sideloadly yapacak)
        run: |
          set -o pipefail
          # xcodebuild binlerce satır basıyor; hata mesajı içinde kayboluyor.
          # Günlüğü dosyaya alıp başarısızlıkta SADECE hata satırlarını
          # yazdırıyoruz — böylece tek bakışta ne olduğu görülüyor.
          if ! xcodebuild \
            -project fotoyol.xcodeproj \
            -scheme fotoyol \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath yapi \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build > derleme.log 2>&1; then
              echo ""
              echo "================== DERLEME HATALARI =================="
              grep -E "error:" derleme.log | sed "s|$PWD/||" | sort -u | head -60
              echo "====================================================="
              echo ""
              echo "(tam günlük 'derleme-gunlugu' eseri olarak yüklendi)"
              exit 1
          fi
          echo "✅ derleme başarılı"

      - name: Tam günlüğü sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-gunlugu
          path: derleme.log
          retention-days: 7
          if-no-files-found: ignore

      - name: .ipa dosyasına paketle
        run: |
          mkdir -p Payload
          cp -R yapi/Build/Products/Release-iphoneos/fotoyol.app Payload/
          zip -qry fotoyol.ipa Payload
          ls -lh fotoyol.ipa

      - name: İndirilebilir hale getir
        uses: actions/upload-artifact@v4
        with:
          name: fotoyol-ipa
          path: fotoyol.ipa
          retention-days: 30
