name: FiveWattsOfGlory Windows

# MSVC derlemesi + APO'nun gerçek Windows'ta denenmesi + kurulum/kaldırma denemesi + Defender taraması.
# Kaynak private repodan (pexatasoy/five-watts-of-glory); depoda yalnız bu tarif durur.
on:
  workflow_dispatch:

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - name: Kaynağı çek
        uses: actions/checkout@v4
        with:
          repository: pexatasoy/five-watts-of-glory
          ref: main
          ssh-key: ${{ secrets.ANAHTAR_FIVE_WATTS_OF_GLORY }}
          persist-credentials: false
          path: repo

      - name: Rust
        shell: bash
        run: |
          rustup update stable --no-self-update 2>&1 | tail -2
          rustc --version
          git -C repo log -1 --format='kaynak: %h  %cd  %s'

      - name: Testler
        shell: bash
        working-directory: repo
        run: cargo test --release -p fwg-ses 2>&1 | tail -15

      - name: Derle APO (MSVC)
        shell: bash
        working-directory: repo
        run: |
          cargo build --release -p fwg-apo 2>&1 | tail -3
          ls -l target/release/fivewatts_apo.dll
          mkdir -p ../cikti && cp target/release/fivewatts_apo.dll ../cikti/FiveWattsApo.dll

      - name: APO denemesi (ses motoru taklidi)
        shell: pwsh
        working-directory: repo
        run: |
          cargo build --release -p fwg-deneme 2>&1 | Select-Object -Last 3
          $d = Join-Path $env:RUNNER_TEMP "apo"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item target\release\fivewatts_apo.dll (Join-Path $d "FiveWattsApo.dll")
          & target\release\apo-deneme.exe (Join-Path $d "FiveWattsApo.dll")
          if ($LASTEXITCODE -ne 0) { throw "APO denemesi başarısız ($LASTEXITCODE)" }

      - name: Derle uygulama (MSVC)
        shell: pwsh
        working-directory: repo
        run: |
          $env:FWG_APO_DLL = (Resolve-Path target\release\fivewatts_apo.dll).Path
          cargo build --release -p fivewattsofglory 2>&1 | Select-Object -Last 3
          Copy-Item target\release\FiveWattsOfGlory.exe ..\cikti\
          Get-ChildItem ..\cikti | Format-Table Name, Length

      - name: Bağımlılıklar
        shell: pwsh
        continue-on-error: true
        run: |
          $db = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          foreach ($f in @("cikti\FiveWattsApo.dll", "cikti\FiveWattsOfGlory.exe")) {
            "===== $f ====="
            & $db.FullName /nologo /dependents $f | Select-String "\.dll"
          }

      - name: Defender taraması
        shell: pwsh
        continue-on-error: true
        run: |
          try { Update-MpSignature -ErrorAction Stop; "imzalar güncellendi" } catch { "imza güncellenemedi: $_" }
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          foreach ($f in @("cikti\FiveWattsOfGlory.exe", "cikti\FiveWattsApo.dll")) {
            $yol = (Resolve-Path $f).Path
            "===== TARAMA: $f ====="
            & $mp -Scan -ScanType 3 -File $yol -DisableRemediation 2>&1 | Out-String
            "çıkış kodu: $LASTEXITCODE  (0 = temiz, 2 = tehdit)"
          }

      - name: Açılış ve panel denemesi
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path deneme | Out-Null
          $p = Start-Process -FilePath "cikti\FiveWattsOfGlory.exe" -ArgumentList "--panel" -PassThru
          Start-Sleep -Seconds 12
          "çalışıyor mu: " + (-not $p.HasExited)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("deneme\ekran.png")
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Start-Sleep -Seconds 2

      - name: Kurulum ve kaldırma denemesi (sahte aygıt)
        shell: pwsh
        continue-on-error: true
        env:
          FWG_SESSIZ: "1"
        run: |
          "yönetici mi: " + ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "ses aygıtları:"; Get-CimInstance Win32_SoundDevice | Select-Object Name, Status | Format-Table | Out-String
          $sahte = "{0.0.0.00000000}.{f00dbabe-0000-4000-8000-000000000001}"
          $p = Start-Process -FilePath "cikti\FiveWattsOfGlory.exe" -ArgumentList "--kur", "`"$sahte`"" -PassThru -Wait
          "--kur çıkış kodu: $($p.ExitCode)  (0 tamam, 2 uyarı = aygıt yok beklenir, 1 hata)"
          $k = "C:\Program Files\FiveWattsOfGlory"
          Get-ChildItem $k -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          "--- kurulum-sonuc.txt"; Get-Content "$k\ayar\kurulum-sonuc.txt" -ErrorAction SilentlyContinue
          "--- icacls ayar"; icacls "$k\ayar"
          "--- kayıt"
          reg query "HKLM\SOFTWARE\FiveWattsOfGlory"
          reg query "HKLM\SOFTWARE\Classes\CLSID\{F76AE411-4424-4A69-96BC-ED909733B9EA}\InprocServer32"
          reg query "HKLM\SOFTWARE\Classes\AudioEngine\AudioProcessingObjects\{F76AE411-4424-4A69-96BC-ED909733B9EA}"
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render\{f00dbabe-0000-4000-8000-000000000001}\FxProperties"
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\FiveWattsOfGlory"
          "--- yedek"; Get-Content "$k\yedek\*.json" -ErrorAction SilentlyContinue
          "--- APO günlüğü"; Get-Content "$k\ayar\apo-gunluk.txt" -ErrorAction SilentlyContinue
          Get-Service audiosrv | Format-Table Name, Status | Out-String

          $p = Start-Process -FilePath "$k\FiveWattsOfGlory.exe" -ArgumentList "--kaldir" -PassThru -Wait
          "--kaldir çıkış kodu: $($p.ExitCode)"
          Start-Sleep -Seconds 6
          "kalan dosya: " + (Test-Path $k)
          "kalan kayıt (hepsi 'yok' olmalı):"
          foreach ($y in @("HKLM:\SOFTWARE\FiveWattsOfGlory", "HKLM:\SOFTWARE\Classes\CLSID\{F76AE411-4424-4A69-96BC-ED909733B9EA}", "HKLM:\SOFTWARE\Classes\AudioEngine\AudioProcessingObjects\{F76AE411-4424-4A69-96BC-ED909733B9EA}", "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render\{f00dbabe-0000-4000-8000-000000000001}\FxProperties", "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\FiveWattsOfGlory")) {
            "  $y : " + $(if (Test-Path $y) { "VAR" } else { "yok" })
          }
          "--- uygulama günlüğü"; Get-Content "$env:APPDATA\FiveWattsOfGlory\gunluk.txt" -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\FiveWattsOfGlory\gunluk.txt" deneme\ -ErrorAction SilentlyContinue

      - name: Deneme çıktıları
        uses: actions/upload-artifact@v4
        with:
          name: windows-deneme
          path: deneme/
          retention-days: 7
          if-no-files-found: ignore

      - name: exe'yi sakla
        uses: actions/upload-artifact@v4
        with:
          name: fivewatts-windows
          path: cikti/
          retention-days: 14
