name: Seyir - tvOS engine compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-engine:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      # Seyir kodu PRIVATE repodan (pexatasoy/seyir); okuma: salt-okunur deploy key.
      - uses: actions/checkout@v4
        with:
          repository: pexatasoy/seyir
          ref: main
          ssh-key: ${{ secrets.ANAHTAR_SEYIR }}
          persist-credentials: false
      - name: Compile and run isolated native engine check
        run: |
          python3 .seyir-probe/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seyir-engine-evidence
          path: evidence/
          retention-days: 7
